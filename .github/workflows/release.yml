name: Release

# Push a tag like v0.9.0 (matching package.json "version") to publish:
#   npm run version:sync -- 0.9.0 && git commit -am "Release 0.9.0" && git tag v0.9.0 && git push --follow-tags
# Tags with a suffix (v1.0.0-rc.1) are published as pre-releases.
#
# Optional signing secrets (builds are unsigned without them):
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.9.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: version
        run: |
          node scripts/sync-version.mjs --check "$RELEASE_TAG"
          version="$(node scripts/sync-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder picks these up when present; unsigned otherwise.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml

  server:
    name: Server tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: server
          if-no-files-found: error
          path: release/chrono-server-*.tar.gz

  android:
    name: Android companion
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: node scripts/sync-version.mjs "${{ needs.verify.outputs.version }}"
      - run: npm run build && npx cap sync android
      - name: Build APK (signed when keystore secrets exist)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../release
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew --no-daemon assembleRelease
            apk="app/build/outputs/apk/release/app-release-unsigned.apk"
            tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            "$tools/zipalign" -p -f 4 "$apk" aligned.apk
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "../release/Chrono-${{ needs.verify.outputs.version }}-android.apk" aligned.apk
          else
            echo "::warning::No Android keystore secrets — publishing a debug-signed APK"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../release/Chrono-${{ needs.verify.outputs.version }}-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: release/*.apk

  docker:
    name: Docker image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    needs: [verify, desktop, server, android, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Chrono ${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | Windows installer (x64 / ARM64) | `Chrono-Setup-${{ needs.verify.outputs.version }}-*.exe` — adds the Chrono right-click menu to Explorer |
            | Windows portable | `Chrono-${{ needs.verify.outputs.version }}-portable.exe` |
            | macOS (Intel / Apple silicon) | `Chrono-${{ needs.verify.outputs.version }}-mac-*.dmg` |
            | Linux | `.AppImage`, `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE), `.tar.gz` |
            | Headless server | `chrono-server-${{ needs.verify.outputs.version }}.tar.gz` or `docker pull ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}` |
            | Android companion | `Chrono-${{ needs.verify.outputs.version }}-android*.apk` |

            Verify downloads with `SHA256SUMS.txt`.
